{% load static assets %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ThingBD CRM{% endblock %} · ThingBD CRM</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  {# Development: CDN builds + in-browser Tailwind. Production images: compiled CSS + vendored copies (apps/core/assets.py). #}
  <link rel="stylesheet" href="{% asset 'select2-css' %}">
  <link rel="stylesheet" href="{% asset 'datatables-css' %}">
  <link rel="stylesheet" href="{% static 'css/ui.css' %}">
  {% tailwind %}
  <script src="{% asset 'jquery' %}" defer></script>
  <script src="{% asset 'select2-js' %}" defer></script>
  <script src="{% asset 'datatables-js' %}" defer></script>
  <script src="{% asset 'htmx' %}" defer></script>
  <script src="{% static 'js/ui.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
</body>
</html>
