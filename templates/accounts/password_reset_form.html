{% extends "layouts/auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold">Reset your password</h1>
<p class="mb-6 mt-1 text-sm text-slate-500">Enter your email and we'll send you a reset link.</p>
<form method="post" class="space-y-6">{% csrf_token %}
  {% include "partials/form.html" %}
  <button class="btn btn-primary w-full justify-center">Send reset link</button>
</form>
{% endblock %}
{% block below_card %}
<p class="mt-6 text-center text-sm"><a href="{% url 'accounts:login' %}" class="text-violet-600 hover:underline">Back to log in</a></p>
{% endblock %}
