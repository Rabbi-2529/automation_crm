{% extends "layouts/app.html" %}
{% block title %}Profile{% endblock %}
{% block page_title %}Your profile{% endblock %}
{% block content %}
<form method="post" class="card max-w-lg space-y-6">{% csrf_token %}
  <p class="text-sm text-slate-500">Email: <span class="font-medium text-slate-800">{{ request.user.email }}</span></p>
  {% include "partials/form.html" %}
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
