{% if messages %}
<div class="mb-6 space-y-2">
  {% for message in messages %}
  <div class="rounded-lg px-4 py-3 text-sm ring-1
    {% if message.tags == 'success' %}bg-emerald-50 text-emerald-800 ring-emerald-200
    {% elif message.tags == 'error' %}bg-red-50 text-red-800 ring-red-200
    {% elif message.tags == 'warning' %}bg-amber-50 text-amber-800 ring-amber-200
    {% else %}bg-sky-50 text-sky-800 ring-sky-200{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
