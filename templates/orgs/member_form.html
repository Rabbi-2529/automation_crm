{% extends "layouts/app.html" %}
{% block title %}Edit member{% endblock %}
{% block page_title %}{{ membership.user.display_name }}{% endblock %}
{% block content %}
<form method="post" class="card max-w-lg space-y-6">{% csrf_token %}
  <p class="text-sm text-slate-500">{{ membership.user.email }}</p>
  {% include "partials/form.html" %}
  <div class="flex justify-between">
    <a href="{% url 'orgs:members' %}" class="btn btn-secondary">Cancel</a>
    <button class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
