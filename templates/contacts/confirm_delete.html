{% extends "layouts/app.html" %}
{% block title %}Delete{% endblock %}
{% block page_title %}Delete {{ object }}?{% endblock %}
{% block content %}
<form method="post" class="card max-w-lg space-y-6">{% csrf_token %}
  <p class="text-sm text-slate-600">This can't be undone.{% if warning %} {{ warning }}{% endif %}</p>
  <div class="flex justify-between">
    <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
    <button class="btn btn-danger">Delete</button>
  </div>
</form>
{% endblock %}
