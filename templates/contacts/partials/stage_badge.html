{# Args: stage (value), label #}
<span class="badge {% if stage == 'lead' %}bg-sky-100 text-sky-700{% elif stage == 'qualified' %}bg-violet-100 text-violet-700{% elif stage == 'opportunity' %}bg-amber-100 text-amber-700{% elif stage == 'customer' %}bg-emerald-100 text-emerald-700{% elif stage == 'churned' %}bg-red-100 text-red-700{% else %}bg-slate-100 text-slate-600{% endif %}">{{ label }}</span>
