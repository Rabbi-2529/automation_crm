{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif; }
    .field { @apply mt-1 block w-full rounded-lg border-0 px-3 py-2 text-sm text-slate-900 ring-1 ring-slate-300 focus:ring-2 focus:ring-violet-500 focus:outline-none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen bg-slate-50{% endblock %} text-slate-800 antialiased">
  {% block body %}{% endblock %}
</body>
</html>
