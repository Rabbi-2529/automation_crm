# Local development stack: Django dev server, Celery worker + beat, Postgres, Redis.
# Production overrides (gunicorn, nginx, TLS, backups) come in Phase 8.
# `docker compose up -d` rebuilds the image first (pull_policy: build; cached layers make it quick), so new
# packages in requirements.txt are always installed, and the migrate service then applies new migrations.
x-app: &app
  build: .
  image: automation-crm-app  # one image shared by migrate, web, worker and beat
  pull_policy: build
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://crm:crm@db:5432/crm
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "False"
    ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    # AI assistant: the optional `ollama` service below (docker compose --profile ai up -d). Without it the help
    # center answers on its own. Override in .env to use Groq/OpenRouter/etc. instead.
    AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
  volumes:
    - .:/app

# web, worker and beat start only after migrations finished, so nothing queries a table that doesn't exist yet.
x-after-migrate: &after-migrate
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on: *after-migrate

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info
    depends_on: *after-migrate

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on: *after-migrate

  # Free, open-source AI for the help assistant and reply drafts. Start with the "ai" profile, then pull a model once:
  #   docker compose --profile ai up -d
  #   docker compose exec ollama ollama pull llama3.2:3b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama:
